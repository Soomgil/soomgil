  /community/threads:
    get:
      tags: [Community]
      summary: 커뮤니티 공개 피드 조회
      operationId: listCommunityThreads
      description: >-
        공개 API이므로 인증 없이 호출할 수 있다. 비로그인 조회에서는 likedByMe와 editableByMe가 항상 false다.
        삭제되거나 숨김 처리된 쓰레드는 목록에서 제외한다. 정렬은 createdAt desc, id desc로 고정한다.
      parameters:
        - name: authorId
          in: query
          schema: { type: string, format: uuid }
        - name: query
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Thread page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCommunityThread'
    post:
      tags: [Community]
      summary: 커뮤니티 쓰레드 작성
      operationId: createCommunityThread
      description: 본문 1~500자, 이미지 0~4장. 이미지는 요청자 소유의 ACTIVE media만 연결할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityThreadRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThread'
        '403':
          description: ProblemDetails(code=MEDIA_LINK_FORBIDDEN)
        '422':
          description: ProblemDetails(code=THREAD_MEDIA_LIMIT_EXCEEDED)
  /community/threads/{threadId}:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Community]
      summary: 커뮤니티 쓰레드 상세
      operationId: getCommunityThread
      description: 삭제되거나 숨김 처리된 쓰레드는 존재를 은닉하기 위해 404로 응답한다.
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThread'
        '404':
          description: ProblemDetails(code=THREAD_NOT_FOUND)
    patch:
      tags: [Community]
      summary: 커뮤니티 쓰레드 수정
      operationId: updateCommunityThread
      description: 작성자만 수정할 수 있다. mediaFileIds를 생략하면 기존 첨부를 유지하고, 값을 보내면 전체 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityThreadRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThread'
        '403':
          description: ProblemDetails(code=THREAD_AUTHOR_REQUIRED)
        '404':
          description: ProblemDetails(code=THREAD_NOT_FOUND)
    delete:
      tags: [Community]
      summary: 커뮤니티 쓰레드 삭제
      operationId: deleteCommunityThread
      description: 작성자만 삭제할 수 있고 soft delete로 처리한다. 삭제 후에는 tombstone으로만 남는다.
      responses:
        '204':
          description: Deleted
        '403':
          description: ProblemDetails(code=THREAD_AUTHOR_REQUIRED)
  /community/threads/{threadId}/replies:
