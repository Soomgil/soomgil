          type: boolean
        tripInviteEmailOptIn:
          type: boolean
    CommunityThread:
      type: object
      description: >-
        커뮤니티 공개 피드의 쓰레드. content가 null이면 삭제되거나 숨김 처리된 tombstone이며
        클라이언트는 본문 대신 안내 문구를 표시해야 한다. likeCount와 replyCount는 denormalized
        counter가 아니라 조회 시점 집계값이다.
      required: [id, media, likeCount, replyCount, likedByMe, editableByMe, moderationStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        content:
          type: string
          nullable: true
          maxLength: 500
          description: 삭제 또는 숨김 상태이면 null
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaFile' }
          maxItems: 4
        likeCount: { type: integer }
        replyCount: { type: integer }
        likedByMe: { type: boolean, description: 비로그인 조회에서는 항상 false }
        editableByMe: { type: boolean, description: 작성자 본인만 true }
        moderationStatus: { type: string, enum: [VISIBLE, HIDDEN, DELETED] }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    CommunityThreadReply:
      type: object
      description: >-
        쓰레드 답글. 중첩은 1단계까지만 허용하므로 replies는 depth 0에서만 채워지고
        depth 1인 답글의 replies는 항상 빈 배열이다.
      required: [id, threadId, depth, editableByMe, moderationStatus, createdAt, replies]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        parentReplyId: { type: string, format: uuid, nullable: true }
        author: { $ref: '#/components/schemas/UserSummary' }
        content: { type: string, nullable: true, maxLength: 500 }
        depth: { type: integer, enum: [0, 1] }
        editableByMe: { type: boolean }
        moderationStatus: { type: string, enum: [VISIBLE, HIDDEN, DELETED] }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        replies:
          type: array
          items: { $ref: '#/components/schemas/CommunityThreadReply' }
    PagedCommunityThread:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommunityThread' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PagedCommunityThreadReply:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommunityThreadReply' }
        page: { $ref: '#/components/schemas/PageMeta' }
    CommunityThreadReactionSummary:
      type: object
      description: 좋아요 처리 결과. 멱등이므로 같은 요청을 반복해도 값이 변하지 않는다.
      required: [threadId, liked, likeCount]
      properties:
        threadId: { type: string, format: uuid }
        liked: { type: boolean }
        likeCount: { type: integer }
    CreateCommunityThreadRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        mediaFileIds:
          type: array
          items: { type: string, format: uuid }
          maxItems: 4
    UpdateCommunityThreadRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        mediaFileIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          maxItems: 4
          description: 생략하면 기존 첨부를 유지하고, 빈 배열이면 모두 제거한다.
    CreateCommunityThreadReplyRequest:
      type: object
      required: [content]
      properties:
        parentReplyId: { type: string, format: uuid, nullable: true }
        content: { type: string, minLength: 1, maxLength: 500 }
    UpdateCommunityThreadReplyRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
    TripVoteCandidate:
      type: object
      description: >-
        투표 후보. 투표 시작 시점 snapshot이며 다른 참여자의 취향 점수나 태그는 포함하지 않는다.
        stickerCount는 진행 중에는 중간 집계를 감추기 위해 null이고 종료된 세션에서만 채워진다.
      required: [id, rank]
      properties:
        id: { type: string, format: uuid }
        rank: { type: integer }
        provider: { type: string, nullable: true }
        externalPlaceId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        category: { type: string, nullable: true }
        stickerCount: { type: integer, nullable: true }
    VoteStickerPlacement:
      type: object
      required: [candidateId, stickerCount]
      properties:
        candidateId: { type: string, format: uuid }
        stickerCount: { type: integer, minimum: 1, description: 같은 관광지에 몰아 붙일 수 있어 1보다 클 수 있다 }
    TripVoteParticipantSummary:
      type: object
      description: 개별 참여자가 무엇에 스티커를 붙였는지는 노출하지 않고 진행률만 제공한다.
      required: [total, submitted]
      properties:
        total: { type: integer }
        submitted: { type: integer }
    MyVoteParticipation:
      type: object
      description: 세션별 참여 상태. status가 SUBMITTED이면 더 이상 수정할 수 없다.
      required: [participantId, status, stickerAllowance, usedStickerCount, remainingStickerCount, placements]
      properties:
        participantId: { type: string, format: uuid }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, SUBMITTED] }
        stickerAllowance: { type: integer }
        usedStickerCount: { type: integer }
        remainingStickerCount: { type: integer }
        placements:
          type: array
          items: { $ref: '#/components/schemas/VoteStickerPlacement' }
        submittedAt: { type: string, format: date-time, nullable: true }
    TripVoteSessionDetail:
      type: object
      required: [id, tripId, status, stickerAllowance, selectionCount, candidateCount, candidates]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, OPEN, COMPLETED] }
        stickerAllowance: { type: integer, description: 시작 후 변경 불가 }
        selectionCount: { type: integer, description: 시작 후 변경 불가 }
        candidateCount: { type: integer }
        openedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        completionReason:
          type: string
          nullable: true
          enum: [ALL_SUBMITTED, OWNER_EARLY_CLOSE]
        participantSummary: { $ref: '#/components/schemas/TripVoteParticipantSummary' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/TripVoteCandidate' }
        regions:
          type: array
          description: 후보를 뽑은 지역 snapshot. 방장이 고른 지역 또는 시작 시점의 여행방 지역이며 이름까지 고정된다.
          items: { $ref: '#/components/schemas/TripVoteRegion' }
    TripVoteRegion:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 10, maxLength: 10, description: 10자리 법정동 코드 }
        name: { type: string, description: 투표 시작 시점의 지역 이름 }
    TripVoteSessionState:
      type: object
      description: >-
        여행 방 진입 시 프론트 라우터 가드가 사용하는 단일 응답. 클라이언트는 nextScreen만 보고 분기한다.
      required: [hasSession, nextScreen]
      properties:
        hasSession: { type: boolean }
        nextScreen: { type: string, enum: [VOTE, WAITING, MAP] }
        session: { $ref: '#/components/schemas/TripVoteSessionDetail' }
        myParticipation: { $ref: '#/components/schemas/MyVoteParticipation' }
    MyVoteStickerState:
      type: object
      required: [sessionId, myParticipation]
      properties:
        sessionId: { type: string, format: uuid }
        myParticipation: { $ref: '#/components/schemas/MyVoteParticipation' }
    TripVoteResultItem:
      type: object
      description: >-
        selectedRank가 같은 항목이 여러 개면 마지막 순위 동점으로 함께 선정된 것이다.
        itineraryOutcome이 SKIPPED_DUPLICATE이면 이미 일정에 있어 추가하지 않은 경우다.
      required: [candidateId, stickerCount, selected]
      properties:
        candidateId: { type: string, format: uuid }
        provider: { type: string, nullable: true }
        externalPlaceId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        stickerCount: { type: integer }
        selected: { type: boolean }
        selectedRank: { type: integer, nullable: true }
        itineraryOutcome:
          type: string
          nullable: true
          enum: [ADDED, SKIPPED_DUPLICATE]
        itineraryItemId: { type: string, format: uuid, nullable: true }
    TripVoteSessionResult:
      type: object
      description: 재시도해도 결과가 달라지지 않는 멱등 응답이다.
      required: [sessionId, tripId, status, selectionCount, results]
      properties:
        sessionId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED] }
        completionReason:
          type: string
          nullable: true
          enum: [ALL_SUBMITTED, OWNER_EARLY_CLOSE]
