      - name: threadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Community]
      summary: 쓰레드 답글 목록
      operationId: listCommunityThreadReplies
      description: >-
        page 단위는 root 답글이며 각 root 답글의 1단계 하위 답글은 replies에 포함되지만 page 계산에는 넣지 않는다.
        정렬은 createdAt asc, id asc로 고정한다.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Reply page
