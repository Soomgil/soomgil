openapi: 3.1.0
info:
  title: Soomgil Backend API
  version: 0.1.0
  description: >
    숨길(Soomgil) V1 백엔드 REST API 협의 초안입니다.
    근거 문서: .agent/docs/product-specs/service_requirements.md,
    .agent/docs/product-specs/product_experience_policy.md,
    .agent/contracts/backend_contract_decisions.md, .agent/contracts/schema.dbml.
    미확정 사항은 TODO 또는 확인 필요로 표시했습니다.
servers:
  - url: https://api.soomgil.example.com/api/v1
    description: Production placeholder. TODO 실제 도메인 확인 필요.
  - url: http://localhost:8080/api/v1
    description: Local development.
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Users
  - name: Regions
  - name: Trips
  - name: Places
  - name: Swipe
    description: Migration-only legacy swipe endpoints.
  - name: Preference
  - name: TripVote
  - name: Itinerary
  - name: Planning
  - name: Chat
  - name: AI
  - name: Media
  - name: Community
  - name: Notifications
  - name: Admin
paths:
  /onboarding/preference-survey:
    get:
      tags: [Preference]
      summary: 회원가입 관광지 10개 조회
      operationId: getOnboardingPreferenceSurvey
      responses:
        '200':
          description: Active survey with exactly 10 ordered places
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /onboarding/preference-survey/responses:
    put:
      tags: [Preference]
      summary: 회원가입 관광지 10개 평가 완료
      operationId: completeOnboardingPreferenceSurvey
      description: 모든 10개 장소의 LIKE 또는 NOPE 응답을 원자적으로 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Onboarding completed
  /home/place-background:
    get:
      tags: [Preference]
      summary: 홈 관광지 배경 조회
      operationId: getHomePlaceBackground
      responses:
        '200':
          description: Place background card
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /places/{provider}/{externalPlaceId}/preference-reaction:
    parameters:
      - $ref: '#/components/parameters/provider'
      - $ref: '#/components/parameters/externalPlaceId'
    put:
      tags: [Preference]
      summary: 장소 선호 반응 저장
      operationId: upsertPreferenceReaction
      description: ONBOARDING, HOME_BACKGROUND, TRIP_VOTE source multiplier는 모두 1.0이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, reaction]
              properties:
                source:
                  type: string
                  enum: [ONBOARDING, HOME_BACKGROUND, TRIP_VOTE]
                reaction:
                  type: string
                  enum: [LIKE, NOPE, SUPER_LIKE]
                sourceResourceId:
                  type: string
      responses:
        '200':
          description: Updated
    delete:
      tags: [Preference]
      summary: 장소 선호 반응 취소
      operationId: removePreferenceReaction
      description: 제거 이벤트를 남기고 현재 반응 상태를 해제한다.
      responses:
        '204':
          description: Removed
  /auth/register:
    post:
      tags: [Auth]
      summary: 이메일/비밀번호 회원가입
      operationId: register
      description: >
        auth.users, auth.user_email_addresses, auth.user_profiles, auth.user_settings,
        auth.user_password_credentials, auth.user_policy_acceptances를 함께 생성한다.
        이메일 인증 token은 원문이 아니라 hash만 저장한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/email-verification-requests:
    post:
      tags: [Auth]
      summary: 이메일 인증 메일 발송 요청
      operationId: requestEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '202':
          description: Accepted
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/email-verifications:
    post:
      tags: [Auth]
      summary: 이메일 인증 token 확인
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일/비밀번호 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password-reset-requests:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 메일 발송 요청
      operationId: requestPasswordReset
      security: []
      description: 계정 존재 여부를 노출하지 않도록 성공/실패 모두 202를 권장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted
  /auth/password-resets:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 실행
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: No Content
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/policy-documents:
    get:
      tags: [Auth]
      summary: 약관/정책 문서 목록 조회
      operationId: listPolicyDocuments
      security: []
      parameters:
        - name: requiredOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: languageCode
          in: query
          schema:
            type: string
            default: ko
            maxLength: 12
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyDocument'
  /auth/oauth/{provider}/authorization-url:
    get:
      tags: [Auth]
      summary: 소셜 로그인 authorization URL 발급
      operationId: getOAuthAuthorizationUrl
      security: []
      description: 프론트가 provider URL을 직접 만들지, 서버가 만들지 확인 필요.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProviderCode'
        - name: redirectUri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationUrlResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/oauth/{provider}/callback:
    post:
      tags: [Auth]
      summary: 소셜 로그인 callback 처리
      operationId: handleOAuthCallback
      security: []
      description: 신규 소셜 계정의 약관 동의/displayName 보완 흐름 확인 필요.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProviderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 재발급
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 현재 refresh session revoke
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [Me]
      summary: 현재 사용자 조회
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      summary: 현재 사용자 프로필 수정
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Me]
      summary: 계정 즉시 탈퇴
      operationId: requestAccountDeletion
      description: >
        auth.users.status를 즉시 DELETED로 전환하고 세션·인증 수단을 폐기하며 개인정보를 익명화한다.
        소유한 여행방은 가장 먼저 참여한 활성 구성원에게 이전하고, 다른 활성 구성원이 없으면 함께 삭제한다.
        이후 사용자의 모든 활성 여행방 멤버십을 LEFT로 전환한다.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/settings:
    get:
      tags: [Me]
      summary: 내 사용자 설정 조회
      operationId: getMySettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
    patch:
      tags: [Me]
      summary: 내 사용자 설정 수정
      operationId: updateMySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
  /users:
    get:
      tags: [Users]
      summary: 사용자 검색
      operationId: searchUsers
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserSummary'
  /users/{userId}:
    get:
      tags: [Users]
      summary: 사용자 공개 프로필 조회
      operationId: getUser
      description: PRIVATE 프로필은 승인된 follower에게만 전체 프로필을 반환하고, 미승인 사용자에게는 제한된 summary를 반환한다. block account는 MVP에서 제공하지 않는다.
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/follow:
    put:
      tags: [Users]
      summary: 사용자 팔로우
      operationId: followUser
      description: self-follow는 CANNOT_FOLLOW_SELF로 거절한다. 대상 프로필이 PRIVATE이면 PENDING follow request를 생성하고, PUBLIC이면 ACTIVE follow를 생성한다.
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Follow'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: 팔로우 취소
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/followers:
    get:
      tags: [Users]
      summary: 사용자 팔로워 목록
      operationId: listUserFollowers
      description: PUBLIC 프로필은 누구나 조회할 수 있고, PRIVATE 프로필은 본인만 조회할 수 있다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/following:
    get:
      tags: [Users]
      summary: 사용자 팔로잉 목록
      operationId: listUserFollowing
      description: PUBLIC 프로필은 누구나 조회할 수 있고, PRIVATE 프로필은 본인만 조회할 수 있다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/follow-requests:
    get:
      tags: [Users]
      summary: 내 비공개 프로필 follow 요청 목록
      operationId: listMyFollowRequests
      description: 내 PRIVATE 프로필에 대한 PENDING follow request를 조회한다.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFollowRequest'
  /me/follow-requests/{userId}/accept:
    put:
      tags: [Users]
      summary: follow 요청 승인
      operationId: acceptFollowRequest
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Follow'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/follow-requests/{userId}:
    delete:
      tags: [Users]
      summary: follow 요청 거절
      operationId: rejectFollowRequest
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  /legal-regions:
    get:
      tags: [Regions]
      summary: 법정동 지역 검색
      operationId: searchLegalRegions
      security: []
      description: 공개 여부 확인 필요.
      parameters:
        - $ref: '#/components/parameters/q'
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/LegalRegionLevel'
        - name: parentCode
          in: query
          schema:
            type: string
            maxLength: 10
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLegalRegion'
  /viewport:
    get:
      tags: [Regions]
      summary: 지도 viewport 요약
      operationId: summarizeViewport
      parameters:
        - name: bbox
          in: query
          required: true
          description: minLng,minLat,maxLng,maxLat 순서의 지도 경계
          schema:
            type: string
            example: 126.9,37.4,127.2,37.7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewportSummary'
        '422':
          $ref: '#/components/responses/ValidationError'
  /coordinates/simplify:
    post:
      tags: [Regions]
      summary: 지도 좌표 목록 단순화
      operationId: simplifyCoordinates
      description: 첫 좌표와 마지막 좌표를 유지하면서 좌표 수를 제한한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimplifyCoordinatesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimplifiedCoordinates'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{tripId}/vote-sessions/current:
    parameters:
      - $ref: '#/components/parameters/tripId'
    get:
      tags: [TripVote]
      summary: 여행 방 진입 화면 판정과 현재 투표 상태
      operationId: getCurrentTripVoteSession
      description: >-
        프론트 라우터 가드가 사용하는 단일 진입점이다. 서버가 세션 상태와 참여 상태를 조합해
        nextScreen(VOTE, WAITING, MAP)을 계산하므로 클라이언트는 이 값만 보고 분기한다.
        세션이 없거나 요청자가 참여자가 아니면 MAP을 반환한다.
      responses:
        '200':
          description: Vote gate state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripVoteSessionState'
        '403':
          $ref: '#/components/responses/Forbidden'
  /trips/{tripId}/vote-sessions:
    parameters:
      - $ref: '#/components/parameters/tripId'
    post:
      tags: [TripVote]
      summary: 투표 시작
      operationId: openTripVoteSession
      description: >-
        방장만 호출할 수 있다. 시작 시점의 활성 참여자 전원을 투표 참여자로 확정하고,
        여행 지역과 참여자 누적 취향으로 만든 추천 후보를 세션 snapshot으로 고정한다.
        stickerAllowance와 selectionCount는 시작 후 변경할 수 없고 후보 수를 넘을 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenVoteSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripVoteSessionDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: ProblemDetails(code=VOTE_SESSION_ALREADY_OPEN)
        '422':
          description: ProblemDetails(code=VOTE_CANDIDATE_POOL_INSUFFICIENT)
  /trips/{tripId}/vote-sessions/{sessionId}/my-stickers:
    parameters:
      - $ref: '#/components/parameters/tripId'
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [TripVote]
      summary: 내 스티커 배치 저장
      operationId: saveMyVoteStickers
      description: >-
        부분 변경이 아니라 현재 배치 전체를 보내는 snapshot 방식이다. 목록에서 빠진 후보는
        스티커가 회수된 것으로 처리되므로 이동과 회수를 별도 API 없이 표현한다.
        한 후보에 여러 개를 몰아 붙일 수 있고 총합은 지급량을 넘을 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveVoteStickersRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyVoteStickerState'
        '403':
          description: ProblemDetails(code=VOTE_NOT_PARTICIPANT)
        '409':
          description: ProblemDetails(code=VOTE_ALREADY_SUBMITTED or VOTE_SESSION_CLOSED)
        '422':
          description: ProblemDetails(code=VOTE_STICKER_ALLOWANCE_EXCEEDED or VOTE_CANDIDATE_NOT_FOUND)
  /trips/{tripId}/vote-sessions/{sessionId}/my-submission:
    parameters:
      - $ref: '#/components/parameters/tripId'
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [TripVote]
      summary: 내 투표 제출
      operationId: submitMyVote
      description: >-
        제출 후에는 수정할 수 없다. 이 제출로 모든 활성 참여자가 제출을 마치면 서버가 같은
        transaction 안에서 세션을 자동 종료하고 결과를 확정한다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitVoteRequest'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripVoteSessionState'
        '403':
          description: ProblemDetails(code=VOTE_NOT_PARTICIPANT)
        '409':
          description: ProblemDetails(code=VOTE_ALREADY_SUBMITTED or VOTE_SESSION_CLOSED)
  /trips/{tripId}/vote-sessions/{sessionId}/completion:
    parameters:
      - $ref: '#/components/parameters/tripId'
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [TripVote]
      summary: 방장 조기 종료
      operationId: closeTripVoteSession
      description: >-
        방장만 호출할 수 있다. 미투표 참여자가 있으면 acknowledgeUnvotedParticipants가 true여야 한다.
        이미 종료된 세션에 호출해도 실패가 아니라 같은 결과를 반환하는 멱등 연산이다.
        종료 전이와 결과 반영이 모두 조건부 UPDATE로 보호되어 재시도해도 일정과 취향이 중복 반영되지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseVoteSessionRequest'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripVoteSessionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: ProblemDetails(code=VOTE_UNVOTED_PARTICIPANTS_NOT_ACKNOWLEDGED)
  /trips/{tripId}/vote-sessions/{sessionId}/result:
    parameters:
      - $ref: '#/components/parameters/tripId'
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [TripVote]
      summary: 투표 결과 조회
      operationId: getTripVoteSessionResult
      description: >-
        종료된 세션만 조회할 수 있다. 진행 중 세션의 중간 집계는 노출하지 않는다.
        선정된 관광지는 일차 미정 일정에 추가되며 이미 일정에 있던 관광지는 SKIPPED_DUPLICATE로 표시된다.
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripVoteSessionResult'
        '404':
          description: ProblemDetails(code=VOTE_SESSION_NOT_FOUND)
