              $ref: '#/components/schemas/CreateModerationActionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationAction'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    tripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    dayId:
      name: dayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    routeId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    drawingId:
      name: drawingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    checklistId:
      name: checklistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    mediaFileId:
      name: mediaFileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    postId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PlaceProvider'
    externalPlaceId:
      name: externalPlaceId
      in: path
      required: true
      schema:
        type: string
        maxLength: 120
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offset:
      name: offset
      in: query
      description: Offset 기반 무한스크롤 시작 위치. Chat/AI message 목록에서 사용한다.
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      description: Offset 기반 무한스크롤 page size. Chat/AI message 목록에서 사용한다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    sort:
      name: sort
      in: query
      description: field,asc 또는 field,desc. Endpoint별 whitelist 적용.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    q:
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 120
    bbox:
      name: bbox
      in: query
      description: minLng,minLat,maxLng,maxLat
      schema:
        type: string
        pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: 중복 생성/외부 호출 방지용 key.
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    websocketSessionId:
      name: X-Soomgil-WebSocket-Session-Id
      in: header
      description: 협업 undo/redo stack 귀속용 활성 WebSocket 세션 ID.
      required: false
      schema:
        type: string
        maxLength: 120
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Validation or business rule error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded. Retry-After header is included when a retry time is known.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGateway:
      description: Upstream provider error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        sort:
          type: array
          items:
            type: string
    OffsetPageMeta:
      type: object
      required: [offset, limit, hasMore]
      properties:
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        nextOffset:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        sort:
          type: array
          description: Fixed order for MVP chat/AI message lists.
          items:
            type: string
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, PENDING_DELETION, DELETED]
    OAuthProviderCode:
      type: string
      enum: [KAKAO, GOOGLE]
      description: V1 활성 소셜 provider. Naver/Apple은 provider table 데이터 확장 후보.
    TripStatus:
      type: string
      enum: [ACTIVE, ARCHIVED, DELETED]
    TripMemberRole:
      type: string
      enum: [MEMBER]
      description: MVP trip.trip_members.role value. OWNER is not stored in trip_members.
    TripAccessRole:
      type: string
      enum: [OWNER, MEMBER]
      description: Derived API role. OWNER means user.id equals trip.owner_user_id.
    TripMemberStatus:
      type: string
      enum: [ACTIVE, LEFT, REMOVED]
    UserProfileVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    FollowStatus:
      type: string
      enum: [PENDING, ACTIVE, DELETED]
    InviteStatus:
      type: string
      enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
    LegalRegionLevel:
      type: string
      enum: [SIDO, SIGUNGU, EUPMYEONDONG]
    PlaceProvider:
      type: string
      enum: [KTO]
      description: TODO future provider 확장.
    PlaceSourceStatus:
      type: string
      enum: [AVAILABLE, DELETED, UNKNOWN]
    SwipeReaction:
      type: string
      enum: [LIKE, NOPE, SUPER_LIKE]
    RecommendationTab:
      type: string
      enum: [BASIC, SUPER_LIKE]
      default: BASIC
    ItineraryDayGroupType:
      type: string
      enum: [DAY, UNSCHEDULED]
    ItineraryItemType:
      type: string
      enum: [PLACE, CUSTOM_PLACE]
    RouteMode:
      type: string
      enum: [DRIVING, WALKING]
    GeometryFormat:
      type: string
      enum: [GEOJSON]
    DrawingType:
      type: string
      enum: [FREEHAND, LINE, POLYGON, MARKER, TEXT, STICKER, IMAGE]
    PlanningScopeType:
      type: string
      enum: [TRIP, DAY]
    AiMessageRole:
      type: string
      enum: [SYSTEM, USER, ASSISTANT, TOOL]
    AiToolExecutionPolicy:
      type: string
      enum: [READ, REVERSIBLE_WRITE, BLOCKED_HIGH_RISK]
    AiToolCallStatus:
      type: string
      enum: [REQUESTED, SUCCEEDED, FAILED, BLOCKED]
    PostVisibility:
      type: string
      enum: [PUBLIC, UNLISTED]
    ModerationStatus:
      type: string
      enum: [VISIBLE, HIDDEN, DELETED]
    ReportTargetType:
      type: string
      enum: [POST, POST_COMMENT]
    ReportReasonCode:
      type: string
      enum: [SPAM, INAPPROPRIATE, HARASSMENT_OR_HATE, RIGHTS_VIOLATION, OTHER]
    ReportReason:
      type: object
      required: [code, displayName]
      properties:
        code:
          $ref: '#/components/schemas/ReportReasonCode'
        displayName:
          type: string
        isActive:
          type: boolean
          description: listReportReasons returns active reasons only.
    ReportStatus:
      type: string
      enum: [OPEN, REVIEWING, RESOLVED, REJECTED]
    ModerationActionType:
      type: string
      enum: [HIDE, RESTORE, DELETE]
    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptedPolicyDocumentIds]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: TODO password policy 확인 필요.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        displayLanguage:
          type: string
          default: ko
          maxLength: 12
        timezone:
          type: string
          default: Asia/Seoul
          maxLength: 50
        marketingEmailOptIn:
          type: boolean
          default: false
        acceptedPolicyDocumentIds:
          type: array
          description: auth.policy_documents 중 필수 약관 동의 id 목록.
          minItems: 1
          items:
            type: string
            format: uuid
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    OAuthAuthorizationUrlResponse:
      type: object
      required: [authorizationUrl, state]
      properties:
        authorizationUrl:
          type: string
          format: uri
        state:
          type: string
    OAuthCallbackRequest:
      type: object
      required: [code, redirectUri]
      properties:
        code:
          type: string
        redirectUri:
          type: string
          format: uri
        state:
          type: string
        nonce:
          type: string
          description: Provider별 사용 여부 확인 필요.
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
        allDevices:
          type: boolean
          default: false
          description: 확인 필요.
    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Access token TTL seconds. TODO 확정 필요.
        user:
