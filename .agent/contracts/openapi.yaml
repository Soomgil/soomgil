          format: int64
        purpose:
          type: string
          enum: [PROFILE_IMAGE, COMMUNITY_THREAD, MAP_OVERLAY, COMMUNITY_POST]
          description: MAP_OVERLAY는 JPG/PNG/WebP와 10MB 제한을 적용한다. COMMUNITY_POST는 migration-only legacy 값이다.
    UploadUrlResponse:
      type: object
      required: [uploadUrl, objectKey, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT, POST]
          default: PUT
        objectKey:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CreateMediaFileRequest:
      type: object
      required: [objectKey, mimeType, byteSize]
      properties:
        objectKey:
          type: string
        publicUrl:
          type: string
          format: uri
        mimeType:
          type: string
        byteSize:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        linkedResourceType:
          type: string
          description: Optional resource binding target. Server validates caller permission for the target.
        linkedResourceId:
          type: string
          format: uuid
    MediaFile:
      type: object
      required: [id, mimeType, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        publicUrl:
          type: string
          format: uri
          description: 공개 가능한 media에만 존재하는 영구 URL.
        servingUrl:
          type: string
          format: uri
          description: 권한 확인 후 발급하는 비공개 media 표시 URL.
        servingUrlExpiresAt:
          type: string
          format: date-time
          description: servingUrl 만료 시각. 영구 publicUrl만 제공하는 경우 null이다.
        mimeType:
          type: string
        byteSize:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
          enum: [ACTIVE, DELETED, PURGED]
        createdAt:
          type: string
          format: date-time
    CommunityPostSummary:
      type: object
      required: [id, title, visibility, moderationStatus, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceTripId:
          type: string
          format: uuid
        publishedBy:
          $ref: '#/components/schemas/UserSummary'
        coverMedia:
          $ref: '#/components/schemas/MediaFile'
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        title:
          type: string
        summary:
          type: string
        hashtags:
          type: array
          items:
            type: string
        likeCount:
          type: integer
        retripCount:
          type: integer
        commentCount:
          type: integer
        mediaCount:
          type: integer
        likedByMe:
          type: boolean
        moderationStatus:
          $ref: '#/components/schemas/ModerationStatus'
        publishedAt:
          type: string
          format: date-time
    CommunityPostDetail:
      allOf:
        - $ref: '#/components/schemas/CommunityPostSummary'
        - type: object
          required: [snapshotVersion, snapshot]
          properties:
            snapshotVersion:
              type: integer
            snapshot:
              $ref: '#/components/schemas/CommunityPostSnapshot'
            media:
              type: array
              items:
                $ref: '#/components/schemas/MediaFile'
            shareToken:
              type: string
              description: UNLISTED 생성 또는 PUBLIC에서 UNLISTED 전환 직후 작성자 응답에만 포함한다. 서버는 hash만 저장한다.
            shareUrl:
              type: string
              format: uri
              description: shareToken을 포함한 공유 URL. 생성/전환/재발급 직후 작성자 응답에만 포함한다.
            shareTokenCreatedAt:
              type: string
              format: date-time
            shareTokenRotatedAt:
              type: string
              format: date-time
    CommunityPostSnapshot:
      type: object
      description: 게시 시점 표시용 immutable snapshot.
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryDay'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteSegment'
        authorDisplay:
          $ref: '#/components/schemas/UserSummary'
    CreateCommunityPostRequest:
      type: object
      required: [sourceTripId, visibility, title, baseVersion]
      properties:
        sourceTripId:
          type: string
          format: uuid
        baseVersion:
          type: integer
          format: int64
          description: Source trip itineraryVersion used to detect publish-after-preview drift.
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        title:
          type: string
          maxLength: 180
        summary:
          type: string
        coverMediaFileId:
          type: string
          format: uuid
        mediaFileIds:
          type: array
          items:
            type: string
            format: uuid
        hashtags:
          type: array
          items:
            type: string
            maxLength: 80
    UpdateCommunityPostRequest:
      type: object
      properties:
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        title:
          type: string
          maxLength: 180
        summary:
          type: string
        coverMediaFileId:
          type: string
          format: uuid
        mediaFileIds:
          type: array
          items:
            type: string
            format: uuid
        hashtags:
          type: array
          items:
            type: string
    CommunityPostShareTokenResponse:
      type: object
      required: [postId, shareToken, shareUrl, rotatedAt]
      properties:
        postId:
          type: string
          format: uuid
        shareToken:
          type: string
          description: Raw token. 이 응답 이후 다시 조회할 수 없다.
        shareUrl:
          type: string
          format: uri
        rotatedAt:
          type: string
          format: date-time
    PagedCommunityPostSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommunityPostSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    CommunityPostReactionSummary:
      type: object
      required: [postId, liked, likeCount]
      properties:
        postId:
          type: string
          format: uuid
        liked:
          type: boolean
        likeCount:
          type: integer
    RetripRequest:
      type: object
      properties:
        title:
          type: string
          description: 미지정 시 원본 게시글 제목 기반. 확인 필요.
    CommunityComment:
      type: object
      required: [id, postId, author, depth, moderationStatus, createdAt]
