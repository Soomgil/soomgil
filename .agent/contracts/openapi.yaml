        selectionCount: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/TripVoteResultItem' }
        unscheduledDayId: { type: string, format: uuid, nullable: true }
        itineraryVersion: { type: integer, format: int64, nullable: true }
    OpenVoteSessionRequest:
      type: object
      required: [stickerAllowance, selectionCount]
      properties:
        stickerAllowance:
          type: integer
          minimum: 1
          description: 사용자당 스티커 지급 개수. 후보 수를 넘을 수 없다.
        selectionCount:
          type: integer
          minimum: 1
          description: 최종 선정 관광지 개수. 후보 수를 넘을 수 없다.
        candidateCount:
          type: integer
          minimum: 1
          nullable: true
          description: 만들 후보 수. 생략하면 기본 10개.
        legalRegionCodes:
          type: array
          maxItems: 20
          nullable: true
          items: { type: string, minLength: 10, maxLength: 10 }
          description: >-
            이번 투표에서 후보를 뽑을 10자리 법정동 코드. 생략하면 여행방에 등록된 지역을 쓰고,
            그것도 없으면 대표 목적지 문자열로 대체 검색한다. 셋 다 없으면 422 VOTE_CANDIDATE_POOL_INSUFFICIENT.
            형식이 다른 코드는 400 VALIDATION_FAILED.
