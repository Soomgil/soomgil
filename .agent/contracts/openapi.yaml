      tags: [Community]
      summary: 쓰레드 답글 작성
      operationId: createCommunityThreadReply
      description: parentReplyId를 지정하면 1단계 하위 답글이 된다. 이미 1단계인 답글을 부모로 지정하면 거절한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityThreadReplyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThreadReply'
        '422':
          description: ProblemDetails(code=THREAD_REPLY_DEPTH_EXCEEDED)
  /community/threads/{threadId}/replies/{replyId}:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: replyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Community]
      summary: 쓰레드 답글 수정
      operationId: updateCommunityThreadReply
      description: 답글 작성자만 수정할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityThreadReplyRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThreadReply'
        '403':
          description: ProblemDetails(code=THREAD_AUTHOR_REQUIRED)
    delete:
      tags: [Community]
      summary: 쓰레드 답글 삭제
      operationId: deleteCommunityThreadReply
      description: 답글 작성자와 쓰레드 작성자가 삭제할 수 있다. soft delete로 처리해 tombstone을 남긴다.
      responses:
        '204':
          description: Deleted
        '403':
          description: ProblemDetails(code=THREAD_AUTHOR_REQUIRED)
  /community/threads/{threadId}/like:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Community]
      summary: 쓰레드 좋아요
      operationId: likeCommunityThread
      description: 멱등 연산이다. 같은 사용자가 여러 번 호출해도 좋아요는 1개만 유지된다.
